env {
  job.name = "mysql-paimon"
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    plugin_output = "mysql_source"
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://192.168.11.111:3306/vsp_mock"
    user = "root"
    password = "123456"
    query = "select * from battlefield_intelligence"
  }
}

transform {
}

sink {
  Paimon {
    plugin_input = "mysql_source"
    catalog_name = "seatunnel_test"
    catalog_type = "jdbc"
    catalog_uri = "jdbc:mysql://192.168.11.111:3306/paimon_db"
    jdbc.user = "root"
    jdbc.password = "123456"
    warehouse = "s3a://vsp/warehouse"
    database = "ds_001"
    table = "ods_${table_name}"
