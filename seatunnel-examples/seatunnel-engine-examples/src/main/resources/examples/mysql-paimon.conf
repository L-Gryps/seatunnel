      fs.s3a.access-key="rccfs0pHG7wcpXbcyL9M"
      fs.s3a.secret-key="3UKHGXhH9Gd8EnF97HXIyhq91Cx6P2MhRgfYE04W"
      fs.s3a.endpoint="http://192.168.11.120:9100"
      fs.s3a.path.style.access="true"
